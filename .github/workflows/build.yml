name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: In-game smoke test (headless client)
        if: success()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          mkdir -p build/autotest
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\nrenderDistance:8\nsimulationDistance:6\nmaxFps:60\ngraphicsMode:0\nao:false\nrenderClouds:"false"\nsoundCategory_master:0.0\nnarrator:0\n' > build/autotest/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runAutoTest --no-daemon 2>&1 | tee autotest.log
      - name: Publish outputs to the ci-output branch
        if: always()
        run: |
          mkdir -p out
          cp build/libs/*.jar out/ 2>/dev/null || true
          cp build.log out/ 2>/dev/null || true
          tail -c 400000 autotest.log > out/autotest.log 2>/dev/null || true
          cp build/autotest/autotest-report.txt out/ 2>/dev/null || true
          cp build/autotest/logs/latest.log out/game-latest.log 2>/dev/null || true
          cp -r build/autotest/crash-reports out/ 2>/dev/null || true
          cp -r build/autotest/screenshots out/ 2>/dev/null || true
          cp -r build/test-results/test out/test-results 2>/dev/null || true
          echo "${GITHUB_SHA}" > out/COMMIT
          cd out
          git init -q
          git checkout -q -b ci-output
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BeamPhysics-jar
          path: build/libs/*.jar
